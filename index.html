<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Camps</title>
    <meta name="description" content="Camp milestone and yearly pace tracker." />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="favicon.ico" />
    <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Camps" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero stack">
        <img
          class="logo"
          src="assets/camp-milestones-logo.png"
          alt="Camp Milestones"
          width="600"
          height="268"
        />
        <div class="hero-copy stack">
          <h1 class="visually-hidden">Camp Milestones</h1>
          <p class="hero-subtitle">Track your camps and milestones.</p>
        </div>
      </header>

      <form id="milestone-form" class="camp-entry" novalidate>
        <label class="camp-entry__label" for="current-count">Your camps</label>

        <div class="camp-entry__control">
          <input
            class="camp-entry__input"
            type="number"
            id="current-count"
            name="current-count"
            min="0"
            max="365"
            step="1"
            inputmode="numeric"
            pattern="[0-9]*"
            enterkeyhint="done"
            autocomplete="off"
            placeholder="0"
            aria-describedby="count-error"
            aria-errormessage="count-error"
          />

          <button type="button" id="increment" class="increment-btn" aria-label="Add one camp">
            +
          </button>
        </div>
        <p class="field-error" id="count-error" aria-live="polite"></p>
        <p class="count-update-feedback" id="count-update-feedback" aria-hidden="true"></p>
      </form>

      <section id="results" class="is-hidden">
        <p id="results-summary" class="visually-hidden" role="status" aria-live="polite"></p>
        <div class="pace-card reveal-item" data-reveal>
          <div class="pace-card-header">
            <div>
              <p class="eyebrow">Progress</p>
              <h2>Annual Camp Progress</h2>
            </div>
            <p class="pace-count"><span id="pace-current-camps">—</span>/250</p>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="250 camp progress"
            aria-valuemin="0"
            aria-valuemax="250"
            aria-valuenow="0"
          >
            <div id="progress-fill" class="progress-fill"></div>
          </div>

          <div class="pace-metrics">
            <div>
              <span>Progress</span>
              <strong id="progress-percent">—</strong>
            </div>
            <div>
              <span>To 250</span>
              <strong id="remaining-to-250">—</strong>
            </div>
            <div>
              <span>Projected</span>
              <strong id="projected-year-end-camps">—</strong>
            </div>
          </div>
        </div>

        <div class="export-panel">
          <button
            type="button"
            id="copy-progress"
            class="export-button"
            aria-label="Copy or send your camp progress"
          >
            Share
          </button>
          <p id="copy-status" class="copy-status" aria-live="polite"></p>
        </div>

        <div class="divider"></div>
        <h2 class="milestone-heading">Milestone Path</h2>

        <div class="milestone-grid">
          <article class="milestone-card reveal-item" data-milestone="50" data-reveal>
            <h3>50</h3>
            <p class="milestone-remaining" id="m-50-remaining">—</p>
            <p class="milestone-date" id="m-50-date">—</p>
          </article>

          <article class="milestone-card reveal-item" data-milestone="100" data-reveal>
            <h3>100</h3>
            <p class="milestone-remaining" id="m-100-remaining">—</p>
            <p class="milestone-date" id="m-100-date">—</p>
          </article>

          <article class="milestone-card reveal-item" data-milestone="150" data-reveal>
            <h3>150</h3>
            <p class="milestone-remaining" id="m-150-remaining">—</p>
            <p class="milestone-date" id="m-150-date">—</p>
          </article>

          <article class="milestone-card reveal-item" data-milestone="200" data-reveal>
            <h3>200</h3>
            <p class="milestone-remaining" id="m-200-remaining">—</p>
            <p class="milestone-date" id="m-200-date">—</p>
          </article>

          <article
            class="milestone-card milestone-card-featured reveal-item"
            data-milestone="250"
            data-reveal
          >
            <h3>250</h3>
            <p class="milestone-remaining" id="m-250-remaining">—</p>
            <p class="milestone-date" id="m-250-date">—</p>
          </article>
        </div>
      </section>

      <script type="module" src="js/main.js"></script>
    </main>
  </body>
</html>
